<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKSHAM 2026 — Logo Launch</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">
<!-- QR code generator, loaded from cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="paper-texture" aria-hidden="true"></div>

<!-- ============================ HEADER ============================ -->
<header class="event-header">
  <div class="crest-row">
    <div class="crest " aria-hidden="true"><img src="assets/afms.png" alt="AFMS Logo"></div>

    <div class="title-block">
      <h1 class="event-title">SAKSHAM 2026</h1>
    </div>

    <div class="crest " aria-hidden="true"><img src="assets/logo.jpg" alt="SAKSHAM LOGO"></div>
  </div>

   <div class="subtitle-block">
      <h1 class="event-subtitle">“Prolonged Global Conflict: Imperatives for AFMS”</h1>
   </div>
	
  <div class="taglines">
    <span class="rule" aria-hidden="true"></span>
    <span class="tagline orange">आरोग्यं परमं बलम्</span>
    <span class="rule" aria-hidden="true"></span>
  </div>
</header>

<!-- ============================ STAGE ============================ -->
<main class="stage-wrap">
  <div class="stage" id="stage">

    <!-- Backdrop / video area, revealed once curtains open -->
    <div class="backdrop" id="backdrop">
      <p class="backdrop-placeholder" id="backdropPlaceholder">
        Inauguration video will appear here.<br>
      </p>
      <video id="inaugurationVideo" playsinline muted style="display:none;">
        <source src="assets/video.mp4" type="video/mp4">
      </video>
    </div>

    <button class="sound-btn" id="soundBtn" type="button">🔈 Tap for sound</button>

    <!-- Curtains -->
    <div class="curtain curtain-left" aria-hidden="true"></div>
    <div class="curtain curtain-right" aria-hidden="true"></div>
    <div class="valance" aria-hidden="true"></div>

    <!-- QR launch button -->
    <button class="qr-launch" id="qrLaunch" type="button" aria-label="Tap to inaugurate the seminar">
      <span class="qr-plate">
        <span id="qrcode"></span>
      </span>
      <span class="qr-caption">Tap / Scan to Inaugurate</span>
      <span class="qr-sub">AAROGYA.BYTES 2026</span>
    </button>

    <!-- Effects overlay for crackers / confetti -->
    <canvas id="effectsCanvas"></canvas>
  </div>
</main>

<p class="footnote">Digital Inauguration &middot; OPP & Digital Health Section, Office of DGAFMS</p>

<script src="script1.js"></script>
</body>
</html>
